name: Sync match data

on:
  schedule:
    # Cron is UTC. WC 2026 kickoffs run noon ET (16:00 UTC) to midnight ET
    # (04:00 UTC), so live matches span ~15:00 UTC through ~06:30 UTC. We sync
    # every 5 min across that window and only every 30 min during the dead
    # hours (07:00-15:00 UTC = ~08:00-16:00 Faroe time) to keep fixtures fresh.
    # GitHub may delay scheduled runs under load; fine for a prediction league.
    - cron: '*/5 15-23 * * *'   # afternoon + evening matches (UTC)
    - cron: '*/5 0-6 * * *'     # late matches rolling into the early hours (UTC)
    - cron: '*/30 7-14 * * *'   # dead window: light touch for fixture updates
  workflow_dispatch: # lets you trigger a manual sync from the Actions tab

permissions:
  contents: read

# Don't pile up runs if one is slow.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run live overlay
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LIVESCORE_API_KEY: ${{ secrets.LIVESCORE_API_KEY }}
          LIVESCORE_API_SECRET: ${{ secrets.LIVESCORE_API_SECRET }}
        run: npm run overlay
