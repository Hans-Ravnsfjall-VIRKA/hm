name: Sync match data

on:
  schedule:
    # Every 5 minutes. Cron runs in UTC. GitHub may delay scheduled runs
    # under load; that is fine for a prediction league.
    - cron: '*/5 * * * *'
  workflow_dispatch: # lets you trigger a manual sync from the Actions tab

permissions:
  contents: read

# Don't pile up runs if one is slow.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run sync
