name: Sync match data

on:
  schedule:
    # Cron is UTC. World Cup kickoffs are spread across the day, so we sync
    # every 5 minutes around the clock: whenever a match goes live it shows up
    # within ~5 minutes instead of waiting on a slower window. GitHub may delay
    # scheduled runs under load, which is fine for a prediction league.
    - cron: '*/5 * * * *'
  workflow_dispatch: # lets you trigger a manual sync from the Actions tab

permissions:
  contents: read

# Don't pile up runs if one is slow.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6   # a watch run polls ~4 min during a match; never hang longer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The live overlay (scores + events) runs FIRST and is the only step that
      # can fail the job, so a slow ESPN fixture pull or a long auto-fill can
      # never starve it or take the run down. The two secondary steps are
      # best-effort and time-capped.
      - name: Run live overlay
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LIVESCORE_API_KEY: ${{ secrets.LIVESCORE_API_KEY }}
          LIVESCORE_API_SECRET: ${{ secrets.LIVESCORE_API_SECRET }}
        run: npm run overlay

      - name: Seed / refresh fixtures (ESPN, keyless)
        # Writes only new fixtures or changed teams/kickoffs, nothing on a
        # no-change run. Pulls in each knockout round when its bracket publishes.
        continue-on-error: true
        timeout-minutes: 2
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ESPN_LEAGUE: fifa.world
        run: npm run sync

      - name: Auto-fill missing predictions at round deadlines
        # When a round's first match kicks off, top up every player's blank
        # matches in that round so nobody is locked out. Skips until a deadline
        # is actually due.
        continue-on-error: true
        timeout-minutes: 2
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run autofill
