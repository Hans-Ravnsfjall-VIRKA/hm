<!doctype html>
<html lang="fo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14151c" />
    <title>VIRKA Tippikapping · HM 2026</title>
    <link rel="icon" href="./virka-mark.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tippikapping" />
    <meta name="application-name" content="Tippikapping" />
    <script>
      // Dark is the default. Apply it before first paint unless the user has
      // explicitly chosen light, so there is no flash either way.
      try {
        if (localStorage.getItem('vt-theme') === 'light') {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#f3f4f9');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <script>
      // Capture the install prompt early so the UI can offer it after mount.
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e; });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
